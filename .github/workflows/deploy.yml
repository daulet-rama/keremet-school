name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Токену нужны права на публикацию Pages и на OIDC-идентификацию,
# иначе deploy-pages падает на этапе проверки окружения.
permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои Pages конфликтуют. Отменять начатый нельзя —
# прерванный деплой оставляет окружение в незавершённом состоянии.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        env:
          # Включает basePath /keremet-school — без него все ассеты
          # уедут в корень домена и вернут 404.
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITE_URL: https://daulet-rama.github.io/keremet-school
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
